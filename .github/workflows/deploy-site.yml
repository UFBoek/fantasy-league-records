
name: Publish league website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: league-pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Stage static website
        run: bash scripts/stage_pages.sh "$RUNNER_TEMP/league-site"

      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/league-site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
