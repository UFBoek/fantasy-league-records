name: Mock FIG Legacy leaderboard 2017-2025
on:
  push:
    branches: [main]
    paths:
      - 'research/build_mock_legacy_2017_2025.py'
      - '.github/workflows/fig-mock-legacy-2017.yml'
  workflow_dispatch:
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Compute full research-only simulated Hall of Fame
        run: python research/build_mock_legacy_2017_2025.py
      - name: Archive research results separately from official Hall
        shell: bash
        run: |
          git add research/fig_mock_legacy_2017_2025_all.csv research/fig_mock_legacy_2017_2025_active.csv research/fig_mock_legacy_2017_2025.json research/fig_mock_legacy_2017_2025.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: expanded hypothetical 2017-2025 Legacy Points leaderboard'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
