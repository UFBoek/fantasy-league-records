name: Update league data

on:
  schedule:
    # GitHub Actions' fastest allowed cadence: every five minutes, UTC.
    # :17 is the hourly full rebuild. The other 11 intervals check whether
    # the final NFL game and all ten Sleeper fantasy scores have completed.
    # GitHub-hosted schedules are best effort and can be delayed or skipped.
    - cron: '2,7,12,22,27,32,37,42,47,52,57 * * * *'
    - cron: '17 * * * *'
    # Monday 11:45 PM Eastern backup full build (DST-aware). Normally the
    # five-minute change probe now starts publication earlier once both ESPN
    # and Sleeper have independently confirmed and stabilized the scores.
    - cron: '45 3,4 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-league-data.yml'
      - 'tests/test_draft_team_history.py'
      - 'scripts/check_refresh_tests.sh'
      - 'scripts/week_finalization.py'
      - 'scripts/quick_refresh_check.py'
      - 'scripts/build_site_data.py'
      - 'scripts/build_playoff_player_scores.py'
      - 'scripts/build_boekmuse_touchdowns.py'
      - 'tests/test_boekmuse_touchdowns.py'
      - 'tests/test_playoff_player_scores.py'
      - 'tests/test_playoff_nfl_wide.py'
      - 'scripts/prepare_player_records.py'
      - 'scripts/validate_refresh.py'
      - 'scripts/build_dynasty_market_history.py'
      - 'tests/test_dynasty_market_history.py'
      - 'tests/test_week_finalization.py'
      - 'tests/test_record_break_watch.js'
      - 'tests/test_team_record_views.js'
      - 'tests/test_trade_ratings.js'
      - 'tests/test_record_drilldowns.js'

# Use the same deployment queue as the website publisher.
concurrency:
  group: league-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Sleeper and RosterAudit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out current league website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Choose full rebuild or five-minute change probe
        id: quick
        shell: bash
        run: |
          # Manual, push, and hourly :17 runs always rebuild the full archive.
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "${{ github.event.schedule }}" == "17 * * * *" ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Full refresh requested."
          # Monday 11:45 PM Eastern is a guaranteed full attempt, not merely a
          # probe. Local-time gating keeps the duplicate DST UTC trigger from
          # running an unnecessary hour early or late.
          elif [[ "${{ github.event.schedule }}" == "45 3,4 * * 2" ]] && \
            python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; n = datetime.now(ZoneInfo("America/New_York")); valid = (n.weekday() == 0 and (n.hour, n.minute) >= (23, 45)) or (n.weekday() == 1 and (n.hour, n.minute) < (0, 45)); raise SystemExit(0 if valid else 1)'; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Monday 11:45 PM Eastern: immediately rebuild completed-week records."
          else
            # The five-minute probe detects the last game finishing and
            # two stable complete Sleeper fantasy score snapshots.
            python scripts/quick_refresh_check.py
          fi

      - name: Set up Python
        if: steps.quick.outputs.refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-automation.txt

      - name: Install refresh dependencies
        if: steps.quick.outputs.refresh == 'true'
        run: python -m pip install -r scripts/requirements-automation.txt

      - name: Check the data pipeline before contacting providers
        if: steps.quick.outputs.refresh == 'true'
        run: bash scripts/check_refresh_tests.sh

      - name: Rebuild Sleeper history, standings, rosters and records
        if: steps.quick.outputs.refresh == 'true'
        shell: bash
        run: |
          if ! python scripts/build_site_data.py > "$RUNNER_TEMP/fig-sleeper-build.log" 2>&1; then
            echo '::error::Sleeper database rebuild failed; existing published records will remain unchanged.'
            tail -n 140 "$RUNNER_TEMP/fig-sleeper-build.log"
            exit 1
          fi
          tail -n 35 "$RUNNER_TEMP/fig-sleeper-build.log"

      - name: Prepare verified completed-week player records for website
        if: steps.quick.outputs.refresh == 'true'
        run: python scripts/prepare_player_records.py

      - name: Backfill verified started-player touchdowns for BoekMuse
        if: steps.quick.outputs.refresh == 'true'
        shell: bash
        run: |
          # The raw NFL stat endpoint is undocumented; outages must never block official league records.
          if python scripts/build_boekmuse_touchdowns.py; then
            echo 'BoekMuse started-player touchdown archive checked.'
          else
            echo '::warning::NFL touchdown feed failed; retaining last verified snapshot.'
            git restore -- data/player_weekly_touchdowns.json
          fi

      - name: Build 70/30 player scores from all played NFL games and Sleeper fallback
        if: steps.quick.outputs.refresh == 'true'
        run: python scripts/build_playoff_player_scores.py

      - name: Refresh completed rookie-pick audit
        if: steps.quick.outputs.refresh == 'true'
        run: python scripts/build_draft_pick_audit.py

      - name: Recalculate direct-trade asset history
        if: steps.quick.outputs.refresh == 'true'
        run: python scripts/build_trade_lineage.py

      - name: Refresh RosterAudit dynasty values (keep last good on failure)
        if: steps.quick.outputs.refresh == 'true'
        shell: bash
        run: |
          if python scripts/build_rosteraudit_values.py; then
            echo 'RosterAudit API request completed.'
          else
            echo '::warning::RosterAudit API was unavailable; retaining the last good snapshot.'
            git restore -- data/rosteraudit_values.json
          fi

      - name: Validate the complete snapshot before publishing
        if: steps.quick.outputs.refresh == 'true'
        run: python scripts/validate_refresh.py

      - name: Record a daily RosterAudit market snapshot
        if: steps.quick.outputs.refresh == 'true'
        shell: bash
        run: |
          # Runs only after the provider coverage check. Never invent earlier prices.
          python scripts/build_dynasty_market_history.py

      - name: Run regression tests against the refreshed data
        if: steps.quick.outputs.refresh == 'true'
        run: bash scripts/check_refresh_tests.sh

      - name: Stamp a new published snapshot only when provider data changed
        if: steps.quick.outputs.refresh == 'true'
        shell: bash
        run: |
          # The browser polls this tiny manifest, not dozens of historical files.
          if ! git diff --quiet -- 'data/*.json'; then
            python - <<'PY'
          import datetime
          import json
          from pathlib import Path
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          Path("data/refresh_manifest.json").write_text(
              json.dumps({"updated_at": now}, indent=2) + chr(10),
              encoding="utf-8",
          )
          PY
          fi

      - name: Commit safe JSON changes
        if: steps.quick.outputs.refresh == 'true'
        id: commit
        shell: bash
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes. Skipping commit and deployment.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh Sleeper and RosterAudit snapshots'
            # A UI/source commit may land while this longer build runs.
            # Rebase only the validated data commit; never force push.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo 'changed=true' >> "$GITHUB_OUTPUT"
                echo 'League data updated on main.'
                exit 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo '::error::Could not publish refreshed data after three safe attempts.'
                exit 1
              fi
              echo "::warning::Main advanced during refresh. Rebasing validated data (attempt $attempt)."
              git fetch origin main
              git rebase origin/main
            done
          fi

  deploy:
    name: Publish refreshed league website
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the refreshed main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage the website with its latest JSON data
        run: bash scripts/stage_pages.sh "$RUNNER_TEMP/league-site"

      - name: Upload refreshed website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/league-site

      - name: Publish refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
