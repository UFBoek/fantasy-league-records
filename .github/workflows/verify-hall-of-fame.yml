name: Verify FIG Hall of Fame
on:
  push:
    branches: [feature/fig-hall-of-fame, main]
    paths:
      - 'hall-of-fame-v240.*'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_hall_of_fame.js'
      - '.github/workflows/verify-hall-of-fame.yml'
  pull_request:
    paths:
      - 'hall-of-fame-v240.*'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/test_hall_of_fame.js'
  workflow_dispatch:
jobs:
  hall-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hall of Fame syntax and archive verification
        run: |
          node --check hall-of-fame-v240.js
          node --check app.js
          node tests/test_hall_of_fame.js
