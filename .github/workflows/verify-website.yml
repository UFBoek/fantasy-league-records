name: Verify website interface

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - '*.js'
      - '*.css'
      - 'scripts/build_css_bundle.py'
      - 'scripts/stage_pages.sh'
      - 'tests/test_css_bundle.py'
      - 'tests/test_dynasty_market_history.py'
      - 'scripts/build_dynasty_market_history.py'
      - 'tests/*.js'
      - 'scripts/check_website_tests.sh'
      - 'scripts/build_dynasty_site_report.js'
      - 'scripts/dynasty_dominance_model.js'
      - 'model_tests/test_dynasty_site_report.js'
      - 'scripts/build_playoff_player_scores.py'
      - 'tests/test_playoff_player_scores.py'
      - 'tests/test_playoff_nfl_wide.py'
      - 'scripts/week_finalization.py'
      - 'scripts/quick_refresh_check.py'
      - 'tests/test_week_finalization.py'
      - '.github/workflows/verify-website.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - '*.js'
      - 'tests/*.js'
      - 'scripts/check_website_tests.sh'
      - 'scripts/build_playoff_player_scores.py'
      - 'tests/test_playoff_player_scores.py'
      - 'tests/test_playoff_nfl_wide.py'
      - 'scripts/week_finalization.py'
      - 'scripts/quick_refresh_check.py'
      - 'tests/test_week_finalization.py'
      - '.github/workflows/verify-website.yml'

jobs:
  website-tests:
    name: Check website regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check interface behavior without blocking Sleeper updates
        run: |
          bash scripts/check_website_tests.sh
          python -m unittest discover -s tests -p 'test_css_bundle.py'
          python -m unittest discover -s tests -p 'test_dynasty_market_history.py'
      - name: Check experimental dynasty publishing and stage the static site
        run: |
          node model_tests/test_dynasty_site_report.js
          node scripts/build_dynasty_site_report.js --runs 1500
          bash scripts/stage_pages.sh "$RUNNER_TEMP/league-site"
          test -f "$RUNNER_TEMP/league-site/data/dynasty_dominance_projection.json"
          grep -q 'dynasty-dominance-v230.js' "$RUNNER_TEMP/league-site/index.html"
      - name: Verify NFL-wide model scoring and Sleeper fallback
        run: |
          python -m pip install requests==2.32.3
          python -m unittest discover -s tests -p 'test_playoff_player_scores.py'
          python -m unittest discover -s tests -p 'test_playoff_nfl_wide.py'
          python -m unittest discover -s tests -p 'test_week_finalization.py'
